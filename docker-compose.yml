version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: surplus_connect_db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-surplus_db}
      POSTGRES_USER: ${POSTGRES_USER:-surplus_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-surplus_pass}
    ports:
      - "${POSTGRES_PORT:-5434}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-surplus_user}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: surplus_connect_app
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-surplus_db}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-surplus_user}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-surplus_pass}
      JWT_SECRET: ${JWT_SECRET:-surplusconnectsecretkey12345678901234567890}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
    name: surplus_connect_postgres_data