# Production Database Configuration - PostgreSQL (Environment Variables)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/surplus_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:surplus_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:surplus_pass}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Configuration - validate mode for production
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Flyway Configuration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

# Production logging
logging.level.com.example.surplusconnect=INFO
logging.level.org.springframework.security=WARN

# JWT Configuration from environment
jwt.secret=${JWT_SECRET:surplusconnectsecretkey123456789012345678901234567890}
jwt.expiration=86400000