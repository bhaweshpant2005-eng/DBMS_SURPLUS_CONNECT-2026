# Database Configuration - PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5433/surplus_db
spring.datasource.username=surplus_user
spring.datasource.password=surplus_pass
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.defer-datasource-initialization=true

# Flyway Configuration
spring.flyway.enabled=false
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=true

# Multipart file upload configuration
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Serve uploaded images as static resources
spring.web.resources.static-locations=classpath:/static/,file:uploads/

# Application logging
logging.level.com.example.surplusconnect=DEBUG
logging.level.org.springframework.security=DEBUG

# Server port
server.port=8080

# JWT Configuration
jwt.secret=surplusconnectsecretkey123456789012345678901234567890
jwt.expiration=86400000