# Test Database Configuration - PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5433/surplus_db_test
spring.datasource.username=surplus_user
spring.datasource.password=surplus_pass
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Configuration for testing
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false

# Disable Flyway for tests (DDL-auto handles schema)
spring.flyway.enabled=false

# Application logging for tests
logging.level.com.example.surplusconnect=INFO
logging.level.org.springframework.security=INFO

# Server port
server.port=8091

# JWT Configuration
jwt.secret=test-secret-key-for-testing-only
jwt.expiration=86400000
